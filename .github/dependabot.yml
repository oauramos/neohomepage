version: 2
updates:
  # Grouped, and monthly. This project pins exact versions deliberately — react-grid-layout,
  # react-draggable and Node's major among them — so a firehose of individual PRs would mostly be
  # noise against decisions that were made on purpose and are documented where they were made.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
