name: Release

# The image is built, smoke-tested and measured here, and nowhere else. A container that is only
# ever built on a laptop is a container whose base image drifts silently between releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to the registry (otherwise build and test only)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Never two releases at once: `imagetools create` is last-write-wins on a tag, so two tags pushed
# together would race and `latest` would end up pointing at whichever finished second.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # Compressed. The plan's ceiling, and the number a person on a slow connection actually waits on.
  MAX_COMPRESSED_MB: 90

jobs:
  smoke:
    # Build for THIS runner's architecture only, and prove the thing runs before spending several
    # minutes emulating another one. A multi-arch build that succeeds and produces an image that
    # exits on boot is a slow way to learn nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build for the local architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: neohomepage:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It boots, serves a board, and seeds a data directory it can back up
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/data"
          # Deliberately as the image ships it: no extra env, no writable root, no capabilities.
          # Exactly as compose.yaml runs it, including the three capabilities the entrypoint
          # needs to make a bind-mounted /data writable and then give up root.
          docker run -d --name neo \
            -p 7575:7575 \
            -v "${RUNNER_TEMP}/data:/data" \
            --memory 320m --read-only --tmpfs /tmp:size=16m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            neohomepage:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7575/ >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then
              echo "::error::the container never served a board"
              docker logs neo
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:7575/ | grep -q 'neo-root' || {
            echo "::error::the served page is not a board"; exit 1; }

          # The whole backup story, checked on the real image: the data directory is seeded, and
          # the two directories that must never be committed are already excluded.
          test -f "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::no .gitignore was seeded"; exit 1; }
          grep -q 'secrets/' "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::secrets/ is not ignored"; exit 1; }
          grep -q 'state/' "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::state/ is not ignored"; exit 1; }

          # The SERVER must be unprivileged, and it must be PID 1.
          #
          # Checked on the process, not with `docker exec id -u`: the entrypoint starts as root to
          # fix the bind mount's ownership and then execs to uid 1000, so `docker exec` reports
          # root and would pass this for entirely the wrong reason.
          # BusyBox ps has no -p, so pick PID 1 out of the table rather than asking for it.
          owner="$(docker exec neo sh -c "ps -o pid,user | awk '\$1==1{print \$2}'" | tr -d ' ')"
          test "$owner" = "node" || {
            echo "::error::the server runs as ${owner}, not the unprivileged user"; exit 1; }

          # A bind mount whose host directory is owned by someone else is the first thing every
          # new user hits, and it used to kill the container on boot.
          test -d "${RUNNER_TEMP}/data/config" || {
            echo "::error::the bind-mounted data directory was never written to"; exit 1; }

          # Development dependencies must not be in a production image. This shipped TypeScript,
          # Playwright and Prettier once, because `pnpm install --prod` over a full install prunes
          # nothing.
          packages="$(docker exec neo sh -c 'ls /app/node_modules/.pnpm | wc -l' | tr -d ' ')"
          echo "production packages: ${packages}"
          test "$packages" -lt 60 || {
            echo "::error::${packages} packages in the runtime image — development dependencies leaked in"
            docker exec neo sh -c 'du -sh /app/node_modules/.pnpm/* | sort -rh | head -20'
            exit 1
          }

          # Health, as the image itself defines it.
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' neo)"
            [ "$status" = "healthy" ] && break
            if [ "$i" = "40" ]; then
              echo "::error::the healthcheck never went green (last: ${status})"
              docker logs neo
              exit 1
            fi
            sleep 2
          done

          # SIGTERM, not SIGKILL: a container that ignores it gets killed mid-write.
          #
          # `docker stop` exits 0 either way, so timing it and printing the number asserts
          # nothing — it passes just as happily on an image that ignored the signal for the whole
          # 15-second grace period. Exit 137 is the tell: that is 128+9, the process was SIGKILLed.
          start=$(date +%s)
          docker stop -t 15 neo >/dev/null
          elapsed=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' neo)"
          echo "stopped in ${elapsed}s with exit ${code}"
          docker logs neo 2>&1 | tail -20
          test "$code" != "137" || {
            echo "::error::the server ignored SIGTERM and was SIGKILLed after the grace period"
            exit 1; }
          test "$elapsed" -lt 10 || {
            echo "::error::shutdown took ${elapsed}s, which means SIGTERM was not handled promptly"
            exit 1; }

      - name: It fits
        run: |
          set -euo pipefail
          bytes=$(docker save neohomepage:smoke | gzip -9 | wc -c)
          mb=$(( bytes / 1024 / 1024 ))
          echo "compressed image: ${mb} MB (ceiling ${MAX_COMPRESSED_MB} MB)"
          echo "### Image size: ${mb} MB compressed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "${MAX_COMPRESSED_MB}" ]; then
            echo "::error::the image is ${mb} MB compressed, over the ${MAX_COMPRESSED_MB} MB ceiling"
            exit 1
          fi

  # One architecture per NATIVE runner, then a manifest list stitched from the digests.
  #
  # Emphatically not `--platform linux/amd64,linux/arm64` under QEMU on one runner, which is the
  # obvious way to write this and does not work: pnpm 12 is a Rust binary on tokio, and tokio's
  # I/O driver panics under qemu-user with `Bad file descriptor` before it installs anything. That
  # was found by building this image on an arm64 laptop, where the amd64 leg failed exactly this
  # way — in CI it would have been the arm64 leg, on the first tagged release.
  #
  # Native runners are also several times faster than emulation, so this costs nothing.
  build:
    needs: smoke
    if: github.event_name == 'push' || inputs.push
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # By digest, with no TAG — but the exporter still needs to know which repository to
          # push the blob to. `push-by-digest` without `name=` fails with "tag is needed when
          # pushing to registry", on both legs, before a byte reaches the registry. The tags
          # belong to the manifest list the next job assembles; tagging here would leave whichever
          # architecture finished last holding `latest`.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: mode=max
          sbom: true

      - name: Record the digest
        run: |
          # Stripped in the shell, not in a GitHub expression — `${x#prefix}` is bash, and the
          # expression language silently is not bash.
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Verify both architectures, then tag
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # Two digests, one per matrix leg. Anything else means a leg failed silently or an
          # artifact went missing, and assembling a one-architecture list under `latest` would
          # publish it to every compose.yaml in the wild.
          count="$(ls -1 | wc -l | tr -d ' ')"
          test "$count" -eq 2 || { echo "::error::expected 2 digests, found ${count}"; exit 1; }

          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          test -n "$tags" || { echo "::error::the metadata action produced no tags"; exit 1; }

          # Assemble under a throwaway tag first and inspect THAT. The release tags are applied
          # only once both platforms are confirmed present — otherwise the check runs after
          # `latest` is already live and pulled, and turning the job red afterwards fixes nothing.
          probe="${REGISTRY}/${IMAGE}:verify-${GITHUB_RUN_ID}"
          docker buildx imagetools create -t "$probe" \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$probe" --raw \
              | jq -e --arg p "$want" '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | index($p)' >/dev/null \
              || { echo "::error::${want} is missing from the manifest list"; exit 1; }
          done

          docker buildx imagetools create $tags $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

      - name: A stranger can pull it
        run: |
          set -euo pipefail
          # A package first published by GITHUB_TOKEN is created PRIVATE even on a public
          # repository, so the release goes green while every `docker compose up -d` in the
          # documentation gets `denied`. Logging out and pulling is the only way to find out.
          version="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker logout ghcr.io
          docker pull "$version" || {
            echo "::error::${version} is not anonymously pullable — the GHCR package is private."
            echo "::error::Fix once at Packages -> neohomepage -> Package settings -> Change visibility."
            exit 1; }
