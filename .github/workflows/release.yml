name: Release

# The container image is built, smoke-tested, measured and published here, and nowhere else.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to the registry (otherwise build and test only)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# `imagetools create` is last-write-wins on a tag, so two releases at once would race for `latest`.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  MAX_COMPRESSED_MB: 90

jobs:
  smoke:
    # Native-architecture build and boot check before the multi-arch build spends minutes on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build for the local architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: neohomepage:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It boots, serves a board, and seeds a data directory it can back up
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/data"
          # Same flags as compose.yaml; the entrypoint needs these three capabilities to chown a
          # bind-mounted /data and then drop root.
          docker run -d --name neo \
            -p 7575:7575 \
            -v "${RUNNER_TEMP}/data:/data" \
            --memory 320m --read-only --tmpfs /tmp:size=16m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            neohomepage:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7575/ >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then
              echo "::error::the container never served a board"
              docker logs neo
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:7575/ | grep -q 'neo-root' || {
            echo "::error::the served page is not a board"; exit 1; }

          test -f "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::no .gitignore was seeded"; exit 1; }
          grep -q 'secrets/' "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::secrets/ is not ignored"; exit 1; }
          grep -q 'state/' "${RUNNER_TEMP}/data/.gitignore" || { echo "::error::state/ is not ignored"; exit 1; }

          # Check PID 1's owner rather than `docker exec id -u`: the entrypoint starts as root and
          # execs to uid 1000, so exec would report root. BusyBox ps has no -p.
          owner="$(docker exec neo sh -c "ps -o pid,user | awk '\$1==1{print \$2}'" | tr -d ' ')"
          test "$owner" = "node" || {
            echo "::error::the server runs as ${owner}, not the unprivileged user"; exit 1; }

          test -d "${RUNNER_TEMP}/data/config" || {
            echo "::error::the bind-mounted data directory was never written to"; exit 1; }

          # `pnpm install --prod` over a full install prunes nothing, so dev dependencies can leak in.
          packages="$(docker exec neo sh -c 'ls /app/node_modules/.pnpm | wc -l' | tr -d ' ')"
          echo "production packages: ${packages}"
          test "$packages" -lt 60 || {
            echo "::error::${packages} packages in the runtime image — development dependencies leaked in"
            docker exec neo sh -c 'du -sh /app/node_modules/.pnpm/* | sort -rh | head -20'
            exit 1
          }

          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' neo)"
            [ "$status" = "healthy" ] && break
            if [ "$i" = "40" ]; then
              echo "::error::the healthcheck never went green (last: ${status})"
              docker logs neo
              exit 1
            fi
            sleep 2
          done

          # `docker stop` exits 0 even when the grace period expires; container exit code 137
          # (128+SIGKILL) is what shows SIGTERM was ignored.
          start=$(date +%s)
          docker stop -t 15 neo >/dev/null
          elapsed=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' neo)"
          echo "stopped in ${elapsed}s with exit ${code}"
          docker logs neo 2>&1 | tail -20
          test "$code" != "137" || {
            echo "::error::the server ignored SIGTERM and was SIGKILLed after the grace period"
            exit 1; }
          test "$elapsed" -lt 10 || {
            echo "::error::shutdown took ${elapsed}s, which means SIGTERM was not handled promptly"
            exit 1; }

      - name: It fits
        run: |
          set -euo pipefail
          bytes=$(docker save neohomepage:smoke | gzip -9 | wc -c)
          mb=$(( bytes / 1024 / 1024 ))
          echo "compressed image: ${mb} MB (ceiling ${MAX_COMPRESSED_MB} MB)"
          echo "### Image size: ${mb} MB compressed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "${MAX_COMPRESSED_MB}" ]; then
            echo "::error::the image is ${mb} MB compressed, over the ${MAX_COMPRESSED_MB} MB ceiling"
            exit 1
          fi

  # One native runner per architecture, stitched into a manifest list. Not QEMU on one runner:
  # pnpm is a tokio binary and tokio's I/O driver panics under qemu-user (`Bad file descriptor`).
  build:
    needs: smoke
    if: github.event_name == 'push' || inputs.push
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # `push-by-digest` still needs `name=` or the exporter fails with "tag is needed when
          # pushing to registry". Tags are applied to the manifest list in the publish job.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: mode=max
          sbom: true

      - name: Record the digest
        run: |
          # `${x#prefix}` is bash; the GitHub expression language has no equivalent.
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest=auto` applies `latest` only to a semver tag with no prerelease suffix:
          # `v0.2.0` yes, `v0.2.0-rc.1` no.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Verify both architectures, then tag
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # One digest per matrix leg; a missing one would publish a single-architecture `latest`.
          count="$(ls -1 | wc -l | tr -d ' ')"
          test "$count" -eq 2 || { echo "::error::expected 2 digests, found ${count}"; exit 1; }

          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          test -n "$tags" || { echo "::error::the metadata action produced no tags"; exit 1; }

          # Assemble under a throwaway tag and verify both platforms before the release tags go live.
          probe="${REGISTRY}/${IMAGE}:verify-${GITHUB_RUN_ID}"
          docker buildx imagetools create -t "$probe" \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$probe" --raw \
              | jq -e --arg p "$want" '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | index($p)' >/dev/null \
              || { echo "::error::${want} is missing from the manifest list"; exit 1; }
          done

          docker buildx imagetools create $tags $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

      - name: A stranger can pull it
        run: |
          set -euo pipefail
          # A package first published by GITHUB_TOKEN is private even on a public repository;
          # only an anonymous pull catches it.
          version="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker logout ghcr.io
          docker pull "$version" || {
            echo "::error::${version} is not anonymously pullable — the GHCR package is private."
            echo "::error::Fix once at Packages -> neohomepage -> Package settings -> Change visibility."
            exit 1; }
