name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Never `corepack enable`: corepack is not distributed with Node >= 25, so that line becomes
      # a time bomb the day the base image moves. pnpm/action-setup reads packageManager instead.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm catalog:test
      - run: pnpm build
      - run: pnpm docs:build

      - name: The widget reference matches the manifests
        # A generated page nobody sees in a diff is a page nobody notices going wrong.
        run: |
          pnpm catalog:docs
          git diff --exit-code docs/widgets/index.md || {
            echo "::error::docs/widgets/index.md is stale — run: pnpm catalog:docs"
            exit 1
          }

      - name: The catalog build is reproducible and small
        # Two claims the publish design rests on, checked rather than asserted. Byte-identical
        # rebuilds are the integrity story that stands in for signing at v1 — anyone can rebuild
        # from the tag and compare the hash. The size cap is the trigger written into the plan for
        # splitting the catalog out of this repository; crossing it should be a decision, not a
        # surprise.
        run: |
          pnpm catalog:build
          first=$(cat catalog-dist/v1/latest.json)
          rm -rf catalog-dist
          pnpm catalog:build
          if [ "$first" != "$(cat catalog-dist/v1/latest.json)" ]; then
            echo "::error::two builds of the same input produced different output"
            exit 1
          fi
          bytes=$(gzip -9 -c catalog-dist/v1/catalog-*.json | wc -c)
          echo "catalog payload: ${bytes} bytes gzipped"
          if [ "$bytes" -gt 262144 ]; then
            echo "::error::the catalog payload is over 256 KiB gzipped — time to split the repository"
            exit 1
          fi

  budgets:
    timeout-minutes: 20
    # Two of the three numbers the plan commits to. The third — RSS under a soak — needs real
    # linux/arm64 under a cgroup and is measured by scripts/memcheck.ts on hardware, because a
    # memory figure taken on a GitHub runner would be a number about GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: First boot, restart and publish latency, at 60 widgets
        # Four runs, so the restart figure is a p95 over three samples rather than over one.
        run: pnpm budgets --runs=4

  restore-drill:
    timeout-minutes: 20
    # The backup claim, executed rather than described: build a dashboard, commit /data, clone it
    # onto an empty directory, boot with the credential in the environment only, and require the
    # resolved tree and the served board to come back identical.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm drill

  browser:
    timeout-minutes: 20
    # The checks that need a real layout engine: axe, the keyboard-only edit session, the board
    # with JavaScript disabled, and tap targets at phone width. Everything else is in vitest,
    # where it runs in milliseconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neohomepage/app exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @neohomepage/app exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: packages/app/test-results/
          retention-days: 7

  boundary:
    # The client/server boundary is load-bearing: src/web is bundled for the browser. Prove the
    # lint rule actually fires rather than trusting that it is configured.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The boundary rule fires, by name
        # Asserting "eslint exited non-zero" is not the same as asserting the rule fired. eslint
        # exits 1 for lint errors and 2 for operational failures — a broken config, or a path
        # matching no files. So if src/web were ever renamed, the override would stop matching,
        # `pnpm lint` would stay green because nothing is left under the old glob, and this job
        # would go green too on eslint's exit 2. The boundary would be entirely unenforced with
        # two green jobs. Checking the rule id by name is what makes that impossible.
        run: |
          set -uo pipefail
          probe=packages/app/src/web/__boundary_probe.ts
          fired() {
            pnpm exec eslint --no-ignore --format json "$probe" > /tmp/probe.json 2>/dev/null
            local status=$?
            test "$status" -eq 1 || { echo "  eslint exited ${status}, expected 1"; return 1; }
            jq -e '[.[].messages[].ruleId] | index("@typescript-eslint/no-restricted-imports")' \
              /tmp/probe.json >/dev/null
          }

          fail=0

          printf '%s\n' "import { readFileSync } from 'node:fs'" "export const p = readFileSync" > "$probe"
          if fired; then echo "ok   node: builtin in src/web"; else echo "::error::a node: import in src/web did not trip the boundary rule"; fail=1; fi

          printf '%s\n' "import { readFileSync } from 'fs'" "export const p = readFileSync" > "$probe"
          if fired; then echo "ok   bare builtin in src/web"; else echo "::error::a bare 'fs' import in src/web did not trip the boundary rule"; fail=1; fi

          printf '%s\n' "import { env } from '../server/env.ts'" "export const p = env" > "$probe"
          if fired; then echo "ok   value import from src/server"; else echo "::error::a value import from src/server did not trip the boundary rule"; fail=1; fi

          # And the negative: type-only imports across the boundary are deliberately allowed, so a
          # rule tightened until everything trips it would pass all of the above and be wrong.
          printf '%s\n' "import type { Env } from '../server/env.ts'" "export type P = Env" > "$probe"
          if fired; then echo "::error::a TYPE-only import from src/server was refused; allowTypeImports has regressed"; fail=1; else echo "ok   type-only import still allowed"; fi

          rm -f "$probe"
          exit $fail

      - name: Remove the probe even if the check failed
        # `if: always()`, because a probe left behind is a file that fails `pnpm lint` for
        # everyone afterwards on a self-hosted or cached checkout.
        if: always()
        run: rm -f packages/app/src/web/__boundary_probe.ts
