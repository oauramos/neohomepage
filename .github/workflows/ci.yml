name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No `corepack enable`: corepack is not shipped with Node >= 25; pnpm/action-setup reads
      # packageManager instead.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm catalog:test
      - run: pnpm build
      - run: pnpm docs:build

      - name: The widget reference matches the manifests
        run: |
          pnpm catalog:docs
          git diff --exit-code docs/widgets/index.md || {
            echo "::error::docs/widgets/index.md is stale — run: pnpm catalog:docs"
            exit 1
          }

      - name: The catalog build is reproducible and small
        # Byte-identical rebuilds stand in for signing at v1; the size cap is the agreed trigger
        # for splitting the catalog into its own repository.
        run: |
          pnpm catalog:build
          first=$(cat catalog-dist/v1/latest.json)
          rm -rf catalog-dist
          pnpm catalog:build
          if [ "$first" != "$(cat catalog-dist/v1/latest.json)" ]; then
            echo "::error::two builds of the same input produced different output"
            exit 1
          fi
          bytes=$(gzip -9 -c catalog-dist/v1/catalog-*.json | wc -c)
          echo "catalog payload: ${bytes} bytes gzipped"
          if [ "$bytes" -gt 262144 ]; then
            echo "::error::the catalog payload is over 256 KiB gzipped — time to split the repository"
            exit 1
          fi

  budgets:
    timeout-minutes: 20
    # RSS under soak is not measured here: it needs linux/arm64 under a cgroup (scripts/memcheck.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: First boot, restart and publish latency, at 60 widgets
        # Four runs: one first boot, then a restart median over three samples.
        run: pnpm budgets --runs=4

  restore-drill:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm drill

  browser:
    timeout-minutes: 20
    # Only the checks that need a real layout engine (axe, keyboard-only editing, no-JS board,
    # tap targets); everything else runs in vitest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neohomepage/app exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @neohomepage/app exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: packages/app/test-results/
          retention-days: 7

  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The boundary rule fires, by name
        # eslint exits 1 for lint errors and 2 for operational failures (broken config, glob
        # matching no files), so a bare non-zero check would stay green if src/web were renamed.
        # The rule id is checked by name.
        run: |
          set -uo pipefail
          probe=packages/app/src/web/__boundary_probe.ts
          fired() {
            pnpm exec eslint --no-ignore --format json "$probe" > /tmp/probe.json 2>/dev/null
            local status=$?
            test "$status" -eq 1 || { echo "  eslint exited ${status}, expected 1"; return 1; }
            jq -e '[.[].messages[].ruleId] | index("@typescript-eslint/no-restricted-imports")' \
              /tmp/probe.json >/dev/null
          }

          fail=0

          printf '%s\n' "import { readFileSync } from 'node:fs'" "export const p = readFileSync" > "$probe"
          if fired; then echo "ok   node: builtin in src/web"; else echo "::error::a node: import in src/web did not trip the boundary rule"; fail=1; fi

          printf '%s\n' "import { readFileSync } from 'fs'" "export const p = readFileSync" > "$probe"
          if fired; then echo "ok   bare builtin in src/web"; else echo "::error::a bare 'fs' import in src/web did not trip the boundary rule"; fail=1; fi

          printf '%s\n' "import { env } from '../server/env.ts'" "export const p = env" > "$probe"
          if fired; then echo "ok   value import from src/server"; else echo "::error::a value import from src/server did not trip the boundary rule"; fail=1; fi

          # Type-only imports across the boundary are allowed; an over-tightened rule must fail here.
          printf '%s\n' "import type { Env } from '../server/env.ts'" "export type P = Env" > "$probe"
          if fired; then echo "::error::a TYPE-only import from src/server was refused; allowTypeImports has regressed"; fail=1; else echo "ok   type-only import still allowed"; fi

          rm -f "$probe"
          exit $fail

      - name: Remove the probe even if the check failed
        # A leftover probe fails `pnpm lint` on a cached checkout.
        if: always()
        run: rm -f packages/app/src/web/__boundary_probe.ts
