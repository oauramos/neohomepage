name: Pages

# Docs and catalog are one deployment (GitHub Pages allows one site per repository); the catalog
# lives at /catalog/v1/ and the pointer file's `movedTo` lets it move later without a client release.

# Runs only after CI has passed on the same commit, so the catalog gates in ci.yml gate publishing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: a half-published catalog pointer would name a payload that
# is not there yet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # `workflow_dispatch` has no conclusion; it is the manual escape hatch for republishing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress reads git history for "last updated" timestamps.
          fetch-depth: 0
          # The commit CI actually tested, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate every manifest against its recorded fixtures
        run: pnpm catalog:test

      - name: The widget reference matches the manifests
        # Repeated from ci.yml because this is the job that publishes the page.
        run: |
          pnpm catalog:docs
          git diff --exit-code docs/widgets/index.md || {
            echo "::error::docs/widgets/index.md is stale — run: pnpm catalog:docs"
            exit 1; }

      - run: pnpm docs:build
      - run: pnpm catalog:build

      - name: Place the catalog inside the docs site
        run: |
          mkdir -p docs/.vitepress/dist/catalog
          cp -r catalog-dist/v1 docs/.vitepress/dist/catalog/v1
          ls -la docs/.vitepress/dist/catalog/v1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
