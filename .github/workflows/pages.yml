name: Pages

# The documentation site and the widget catalog are one deployment, because GitHub Pages allows
# one site per repository. The catalog lands at /catalog/v1/ rather than on its own subdomain;
# the pointer file's `movedTo` field is what makes that safe to bake into clients, so moving the
# catalog to its own repository later costs a one-line change to a JSON file and no client release.

# Only after CI has passed on that exact commit.
#
# This used to trigger directly on a push to main, sharing nothing with ci.yml — so a commit that
# failed lint, typecheck, the test suite, the catalog's byte-identical rebuild or its 256 KiB
# ceiling would still deploy the site AND republish `catalog/v1/latest.json` to every installed
# client. The two gates that exist specifically to protect the published catalog ran in a
# workflow that had no say in whether it got published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: a half-published catalog pointer would name a payload that is
# not there yet, and every client that refreshed in that window would fall back to its cache.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed CI run must not publish. `workflow_dispatch` has no conclusion, so it is allowed
    # through explicitly — that is the manual escape hatch for republishing after fixing Pages
    # settings or the like.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # VitePress reads git history for "last updated" timestamps.
          fetch-depth: 0
          # The commit CI actually tested, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate every manifest against its recorded fixtures
        # The catalog is published from the same commit that passes this, so a manifest that fails
        # its own fixture can never reach a user's install.
        run: pnpm catalog:test

      - name: The widget reference matches the manifests
        # The same staleness check ci.yml runs, repeated here because this is the job that
        # actually publishes the page. A stale reference passing in CI and then being deployed
        # from a later commit is the gap this closes.
        run: |
          pnpm catalog:docs
          git diff --exit-code docs/widgets/index.md || {
            echo "::error::docs/widgets/index.md is stale — run: pnpm catalog:docs"
            exit 1; }

      - run: pnpm docs:build
      - run: pnpm catalog:build

      - name: Place the catalog inside the docs site
        run: |
          mkdir -p docs/.vitepress/dist/catalog
          cp -r catalog-dist/v1 docs/.vitepress/dist/catalog/v1
          ls -la docs/.vitepress/dist/catalog/v1

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
