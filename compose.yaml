# `docker compose up -d`, then open http://<this-host>:7575.

services:
  neohomepage:
    # Multi-arch (amd64 + arm64). Pin a version (ghcr.io/oauramos/neohomepage:0.1.0) for
    # deliberate upgrades. To run from a checkout, swap `image:` for `build: .`.
    image: ghcr.io/oauramos/neohomepage:latest
    container_name: neohomepage
    restart: unless-stopped
    ports:
      - '7575:7575'

    volumes:
      # The only state, and the backup: `git init` it. config/ and assets/ are committed; secrets/
      # and state/ are excluded by a .gitignore the app writes on first boot. See docs/guide/backup.
      - ./data:/data

    environment:
      # Reads are open; writes need these. Unset, the dashboard is editable by anyone who can
      # reach the port.
      # NEOHOMEPAGE_USERNAME: neo
      # NEOHOMEPAGE_PASSWORD: change-me-at-least-eight-characters

      # Service credentials. Config stores `{"$secret": "t3a91f.apiKey"}`, a reference; the value
      # comes from the variable named after it, uppercased with dots and dashes as underscores.
      # `neo doctor` prints the exact name for every credential it cannot find.
      # NEOHOMEPAGE_SECRET_T3A91F_APIKEY: your-sonarr-api-key
      #
      # Or point at a file, for a Docker secret or a mounted credential:
      # NEOHOMEPAGE_SECRET_T3A91F_APIKEY_FILE: /run/secrets/sonarr

      TZ: Etc/UTC

    # 320 MB against a ~90 MB steady state; the image caps V8's old space at 192 MB, so the
    # process reports an OOM instead of being kernel-killed.
    mem_limit: 320m
    memswap_limit: 320m
    # Two vCPUs is the target box. This is a ceiling, not a reservation.
    cpus: 2.0

    # Nothing in this image writes outside /data or escalates.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # CHOWN lets the entrypoint take ownership of the bind-mounted ./data on first boot; SETUID and
    # SETGID let it drop to an unprivileged user. For no root at all, remove this block and set
    # `user: "1000:1000"` on a directory that uid already owns (a named volume, or a host chown -R).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
